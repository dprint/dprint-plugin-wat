[package]
name = "dprint-plugin-wat"
version = "0.0.1"
authors = ["David Sherret <dsherret@gmail.com>"]
edition = "2024"
homepage = "https://github.com/dprint/dprint-plugin-wat"
keywords = ["formatting", "formatter", "wat", "wasm", "webassembly"]
license = "MIT"
repository = "https://github.com/dprint/dprint-plugin-wat"
description = "WebAssembly Text Format formatter for dprint via wat_formatter."

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
opt-level = 3
debug = false
lto = true
debug-assertions = false
overflow-checks = false
panic = "abort"

[features]
wasm = ["serde_json", "dprint-core/wasm"]

[dependencies]
dprint-core = { version = "0.75.0", default-features = false }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
thiserror = "2"
wat_formatter = { version = "0.12.0" }
wat_parser = { version = "0.12.0" }
wat_syntax = { version = "0.12.0" }

[dev-dependencies]
dprint-development = "0.12.1"
serde_json = { version = "1.0" }
